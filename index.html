<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Outfit", sans-serif;
    font-size: 16px;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #e2e8f0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* TITLE BAR */
  #titlebar {
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding: 12px 24px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.5px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
    color: #94a3b8;
  }
  #titlebar span:first-child { color: #f8fafc; }

  /* STATS BAR */
  #statsbar {
    background: rgba(30, 41, 59, 0.8);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 30px;
    flex-shrink: 0;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  }
  .stat-item { font-size: 15px; display: flex; gap: 8px; align-items: center; }
  .stat-item span { font-weight: 700; font-size: 16px; padding: 2px 8px; border-radius: 12px; background: rgba(255,255,255,0.05); }
  .stat-item .ok  { color: #10b981; background: rgba(16, 185, 129, 0.1); }
  .stat-item .bad { color: #ef4444; background: rgba(239, 68, 68, 0.1); }
  .stat-item .pts { color: #8b5cf6; background: rgba(139, 92, 246, 0.1); }

  /* MAIN LAYOUT */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
    padding: 24px;
    gap: 24px;
  }

  /* QUESTION PANEL */
  #question-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: rgba(30, 41, 59, 0.6);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 1.5rem;
    overflow: hidden;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
  }

  #question-body {
    flex: 1;
    padding: 40px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  #question-text {
    font-size: 24px;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 32px;
    color: #f8fafc;
  }
  #question-text strong {
    color: #8b5cf6;
    margin-right: 8px;
  }

  .option-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 16px;
    cursor: pointer;
    padding: 16px 20px;
    background: rgba(255,255,255,0.03);
    border: 2px solid transparent;
    border-radius: 1rem;
    transition: all 0.2s ease;
  }
  .option-row:hover {
    background: rgba(255,255,255,0.08);
    transform: translateY(-2px);
  }
  .option-row input[type=radio] {
    width: 20px;
    height: 20px;
    cursor: pointer;
    accent-color: #8b5cf6;
    flex-shrink: 0;
  }
  .option-row label {
    font-size: 18px;
    cursor: pointer;
    line-height: 1.4;
    color: #e2e8f0;
    flex: 1;
  }
  .option-row.correct { 
    background: rgba(16, 185, 129, 0.1); 
    border-color: #10b981; 
  }
  .option-row.correct label { color: #34d399; font-weight: 600; }
  
  .option-row.wrong { 
    background: rgba(239, 68, 68, 0.1); 
    border-color: #ef4444; 
  }
  .option-row.wrong label { color: #f87171; font-weight: 600; }
  
  .option-row.reveal { 
    border-color: #10b981; 
  }
  .option-row.reveal label { color: #34d399; }

  #feedback-bar {
    padding: 16px 40px;
    font-size: 16px;
    font-weight: 600;
    min-height: 56px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    transition: all 0.3s ease;
  }
  #feedback-bar.ok   { color: #34d399; background: rgba(16, 185, 129, 0.15); border-top: 1px solid rgba(16, 185, 129, 0.3); }
  #feedback-bar.fail { color: #f87171; background: rgba(239, 68, 68, 0.15); border-top: 1px solid rgba(239, 68, 68, 0.3); }
  #feedback-bar.hidden { background: transparent; border-top: 1px solid transparent; }

  /* BOTTOM BUTTONS */
  #btn-bar {
    background: rgba(15, 23, 42, 0.5);
    border-top: 1px solid rgba(255,255,255,0.05);
    padding: 20px 40px;
    display: flex;
    justify-content: flex-end;
    gap: 16px;
    flex-shrink: 0;
  }
  .action-btn {
    padding: 12px 28px;
    font-size: 16px;
    font-weight: 600;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    color: #e2e8f0;
    cursor: pointer;
    border-radius: 0.75rem;
    min-width: 140px;
    transition: all 0.2s ease;
    font-family: inherit;
  }
  .action-btn:hover { 
    background: rgba(255,255,255,0.1); 
    transform: translateY(-2px);
  }
  .action-btn:active { transform: translateY(0); }
  
  .action-btn.primary {
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    border: none;
    color: #fff;
    box-shadow: 0 4px 14px 0 rgba(139, 92, 246, 0.39);
  }
  .action-btn.primary:hover { 
    background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); 
    box-shadow: 0 6px 20px rgba(139, 92, 246, 0.23);
  }

  /* ARROW NAV */
  #arrow-next {
    width: 60px;
    background: rgba(30, 41, 59, 0.6);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 1.5rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: #94a3b8;
    flex-shrink: 0;
    transition: all 0.2s ease;
  }
  #arrow-next:hover { 
    background: rgba(255,255,255,0.1); 
    color: #f8fafc;
  }

  /* SIDEBAR */
  #sidebar {
    width: 280px;
    background: rgba(30, 41, 59, 0.6);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 1.5rem;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }
  #sidebar-header {
    background: rgba(15, 23, 42, 0.5);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    padding: 16px 20px;
    font-weight: 700;
    font-size: 16px;
    color: #f8fafc;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  #sidebar-header .help { 
    color: #8b5cf6; 
    background: rgba(139, 92, 246, 0.1);
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    font-weight: 600; 
    font-size: 14px; 
    cursor: pointer; 
  }
  #sidebar-list {
    overflow-y: auto;
    flex: 1;
    padding: 8px;
  }
  .sidebar-item {
    padding: 12px 16px;
    font-size: 15px;
    cursor: pointer;
    border-radius: 0.75rem;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: all 0.2s;
    color: #cbd5e1;
  }
  .sidebar-item:hover { background: rgba(255,255,255,0.05); }
  .sidebar-item.active { 
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(139, 92, 246, 0.2) 100%); 
    color: #fff; 
    font-weight: 600;
    border: 1px solid rgba(139, 92, 246, 0.3);
  }
  .sidebar-item.done-ok { color: #34d399; }
  .sidebar-item.done-fail { color: #f87171; }
  .sidebar-item.done-skip { color: #64748b; font-style: italic; }

  /* RESULTS OVERLAY */
  #results-screen {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(15, 23, 42, 0.8);
    backdrop-filter: blur(8px);
    z-index: 99;
    align-items: center;
    justify-content: center;
  }
  #results-screen.show { display: flex; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  
  #results-box {
    background: #1e293b;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 1.5rem;
    padding: 40px;
    width: 500px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    color: #e2e8f0;
  }
  #results-box h2 {
    font-size: 28px;
    color: #f8fafc;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 20px;
    margin-bottom: 24px;
    text-align: center;
  }
  .res-row {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    font-size: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .res-row .val { font-weight: 700; font-size: 18px; }
  .res-row .val.ok  { color: #34d399; }
  .res-row .val.bad { color: #f87171; }
  .res-row .val.pts { color: #8b5cf6; font-size: 20px; }
  
  #grade-bar {
    margin: 30px 0;
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    padding: 16px;
    border-radius: 1rem;
  }
  .grade-A { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
  .grade-B { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
  .grade-C { background: rgba(250, 204, 21, 0.15); color: #facc15; border: 1px solid rgba(250, 204, 21, 0.3); }
  .grade-D { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
  
  #btn-retry {
    width: 100%;
    padding: 16px;
    font-size: 18px;
    font-family: inherit;
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    border: none;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
    border-radius: 1rem;
    transition: all 0.2s ease;
    box-shadow: 0 4px 14px 0 rgba(139, 92, 246, 0.39);
  }
  #btn-retry:hover { 
    background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(139, 92, 246, 0.23);
  }

  /* SCROLLBAR STYLE */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
  
  /* ADDING A SUBTLE ANIMATION TO QUESTION PANEL */
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  #question-body {
    animation: slideIn 0.3s ease-out;
  }
</style>
</head>

</div>

let questions = [];
let current = 0;
let aciertos = 0;
let fallos = 0;
let statuses = []; // 'pending','correct','wrong','skip','nocontest'
let selected = null;
let answered = false;

function shuffle(arr) {
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function initQuiz() {
  document.getElementById('results-screen').classList.remove('show');
  questions = shuffle(QUESTIONS_RAW).map(q => ({
    ...q,
    options: shuffle([q.correct, ...q.wrong])
  }));
  aciertos = 0;
  fallos = 0;
  statuses = Array(questions.length).fill('pending');
  current = 0;
  selected = null;
  answered = false;
  buildSidebar();
  renderQuestion();
  updateStats();
}

function buildSidebar() {
  const list = document.getElementById('sidebar-list');
  list.innerHTML = '';
  questions.forEach((q, i) => {
    const div = document.createElement('div');
    div.className = 'sidebar-item' + (i===0?' active':'');
    div.id = `si-${i}`;
    div.textContent = `${getTypeLabel(i)} ${i+1}`;
    div.onclick = () => jumpTo(i);
    list.appendChild(div);
  });
}

function getTypeLabel(i) {
  // alternate labels like the screenshot
  const labels = ['Escoger','Chequear'];
  return labels[i%2];
}

function updateSidebar() {
  questions.forEach((q, i) => {
    const el = document.getElementById(`si-${i}`);
    if(!el) return;
    el.className = 'sidebar-item';
    if(i === current) el.classList.add('active');
    if(statuses[i]==='correct') el.classList.add('done-ok');
    else if(statuses[i]==='wrong') el.classList.add('done-fail');
    else if(statuses[i]==='skip'||statuses[i]==='nocontest') el.classList.add('done-skip');
  });
  // scroll sidebar to current
  const el = document.getElementById(`si-${current}`);
  if(el) el.scrollIntoView({block:'nearest'});
}

function updateStats() {
  const total = questions.length;
  document.getElementById('stat-q').textContent = `${current+1}/${total}`;
  document.getElementById('stat-ok').textContent = aciertos;
  document.getElementById('stat-fail').textContent = fallos;
  document.getElementById('stat-pts').textContent = aciertos;
}

function renderQuestion() {
  const q = questions[current];
  answered = statuses[current] !== 'pending';
  selected = null;

  document.getElementById('question-text').innerHTML = `<strong>${current+1}.</strong> ${q.q}`;

  const container = document.getElementById('options-container');
  container.innerHTML = '';

  q.options.forEach((opt, i) => {
    const row = document.createElement('div');
    row.className = 'option-row';
    row.id = `opt-row-${i}`;

    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = 'opt';
    radio.id = `opt-${i}`;
    radio.value = opt;
    radio.disabled = answered;
    radio.addEventListener('change', () => { selected = opt; });

    const label = document.createElement('label');
    label.htmlFor = `opt-${i}`;
    label.textContent = opt;

    row.appendChild(radio);
    row.appendChild(label);
    row.onclick = () => {
      if(!answered) { radio.checked = true; selected = opt; }
    };
    container.appendChild(row);
  });

  const fb = document.getElementById('feedback-bar');
  fb.className = 'hidden';
  fb.textContent = '';

  // If already answered, show the result visually
  if(answered && statuses[current] !== 'pending') {
    showAnswerVisual(statuses[current]);
  }

  updateStats();
  updateSidebar();
}

function showAnswerVisual(status) {
  const q = questions[current];
  const container = document.getElementById('options-container');
  const fb = document.getElementById('feedback-bar');

  Array.from(container.querySelectorAll('.option-row')).forEach(row => {
    const radio = row.querySelector('input');
    radio.disabled = true;
    const val = radio.value;
    if(val === q.correct) {
      row.className = 'option-row' + (status==='correct' ? ' correct' : ' reveal');
      if(val === q.correct) radio.checked = (status==='correct');
    }
    if(status==='wrong' && val !== q.correct) {
      // mark the wrong selected one
    }
  });

  if(status==='correct') {
    fb.className = 'ok';
    fb.textContent = '✔ ¡Correcto!';
  } else if(status==='wrong') {
    fb.className = 'fail';
    fb.textContent = `✘ Incorrecto. Respuesta correcta: ${q.correct}`;
  } else if(status==='nocontest') {
    fb.className = 'fail';
    fb.textContent = `— No contestada. Respuesta correcta: ${q.correct}`;
  } else if(status==='skip') {
    fb.className = 'fail';
    fb.textContent = '⏩ Pospuesta.';
  }
}

function contestar() {
  if(answered) { goNext(); return; }
  if(selected === null) { alert('Seleccioná una opción para contestar.'); return; }

  const q = questions[current];
  answered = true;
  const isCorrect = (selected === q.correct);

  if(isCorrect) {
    aciertos++;
    statuses[current] = 'correct';
    // mark correct
    const container = document.getElementById('options-container');
    container.querySelectorAll('.option-row').forEach(row => {
      const radio = row.querySelector('input');
      if(radio.value === selected) row.classList.add('correct');
      radio.disabled = true;
    });
    const fb = document.getElementById('feedback-bar');
    fb.className = 'ok';
    fb.textContent = '✔ ¡Correcto!';
  } else {
    fallos++;
    statuses[current] = 'wrong';
    const container = document.getElementById('options-container');
    container.querySelectorAll('.option-row').forEach(row => {
      const radio = row.querySelector('input');
      radio.disabled = true;
      if(radio.value === selected) row.classList.add('wrong');
      if(radio.value === q.correct) row.classList.add('reveal');
    });
    const fb = document.getElementById('feedback-bar');
    fb.className = 'fail';
    fb.textContent = `✘ Incorrecto. Respuesta correcta: ${q.correct}`;
  }

  updateStats();
  updateSidebar();

  // auto advance after short delay
  setTimeout(() => {
    if(checkAllDone()) { showResults(); return; }
    goNext();
  }, 1200);
}

function skipQuestion() {
  if(!answered) statuses[current] = 'skip';
  goNext();
}

function noContestar() {
  if(answered) { goNext(); return; }
  const q = questions[current];
  answered = true;
  statuses[current] = 'nocontest';
  const container = document.getElementById('options-container');
  container.querySelectorAll('.option-row').forEach(row => {
    const radio = row.querySelector('input');
    radio.disabled = true;
    if(radio.value === q.correct) row.classList.add('reveal');
  });
  const fb = document.getElementById('feedback-bar');
  fb.className = 'fail';
  fb.textContent = `— No contestada. Respuesta correcta: ${q.correct}`;
  updateSidebar();
  setTimeout(() => {
    if(checkAllDone()) { showResults(); return; }
    goNext();
  }, 1200);
}

function goNext() {
  // find next pending or next in sequence
  const total = questions.length;
  let next = -1;
  // first try next pending after current
  for(let i=current+1;i<total;i++){
    if(statuses[i]==='pending'||statuses[i]==='skip') { next=i; break; }
  }
  // if none found, wrap around
  if(next===-1) {
    for(let i=0;i<current;i++){
      if(statuses[i]==='pending'||statuses[i]==='skip') { next=i; break; }
    }
  }
  if(next===-1) {
    showResults();
    return;
  }
  current = next;
  renderQuestion();
}

function jumpTo(i) {
  current = i;
  renderQuestion();
}

function checkAllDone() {
  return statuses.every(s => s !== 'pending' && s !== 'skip');
}

function showResults() {
  const total = questions.length;
  const skip = statuses.filter(s=>s==='nocontest'||s==='skip').length;
  const pct = Math.round((aciertos/total)*100);
  let grade, cls;
  if(pct>=90){grade='🏆 Excelente — ¡Dominás el tema!';cls='grade-A';}
  else if(pct>=75){grade='✅ Muy bien — Sólido para el parcial';cls='grade-B';}
  else if(pct>=60){grade='📚 Bien — Repasá los temas flojos';cls='grade-C';}
  else{grade='⚠️ Necesitás más repaso antes del parcial';cls='grade-D';}

  document.getElementById('r-total').textContent = total;
  document.getElementById('r-ok').textContent = aciertos;
  document.getElementById('r-fail').textContent = fallos;
  document.getElementById('r-skip').textContent = skip;
  document.getElementById('r-pct').textContent = pct+'%';
  const gb = document.getElementById('grade-bar');
  gb.textContent = grade;
  gb.className = cls;
  document.getElementById('results-screen').classList.add('show');
}

initQuiz();
</script>
